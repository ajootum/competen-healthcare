<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Competen LifeOS V1.1 Preview</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#183044;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d4e2e6;background:white;color:#183044;padding:9px 12px;border-radius:10px}button:hover{background:#e7f4f1}.primary{background:#116c72;color:white;border-color:#116c72}.layout{display:grid;grid-template-columns:225px 1fr;min-height:100vh}aside{background:#102e40;color:white;padding:22px 12px}aside h2{padding:0 10px}aside button{display:block;width:100%;background:transparent;color:#d7e9eb;border:0;text-align:left;margin:3px 0}aside button.active{background:#2b5866;color:white}main{padding:25px;max-width:1500px;width:100%;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:30px;margin:4px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:8px 0}.muted{color:#687c88;font-size:13px}.eyebrow{color:#167f7b;font-size:11px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #dfe8eb;border-radius:17px;padding:18px;margin-bottom:14px;min-width:0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.stat{font-size:28px;font-weight:800}.week{display:grid;grid-template-columns:repeat(7,minmax(115px,1fr));gap:6px;overflow:auto}.day{min-height:200px;border:1px solid #dce7e9;border-radius:11px;padding:8px}.event{display:block;width:100%;text-align:left;font-size:11px;padding:7px;margin:5px 0;background:#e9f6f4;border-left:4px solid #167b79}.protected{background:#fff3db;border-left-color:#d19a33}.task{padding:12px;border:1px solid #e1e8ea;border-radius:12px;margin:8px 0}.task strong{display:block}.tag{font-size:11px;background:#edf3f5;padding:3px 7px;border-radius:20px}.q2{background:#e7f8ec}.q1{background:#fff0ec}.q3{background:#fff8e7}.q4{background:#f2f3f5}.quadrants{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quad{border-radius:14px;border:1px solid #dce7e9;padding:14px;min-height:170px}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select,.field textarea{padding:10px;border:1px solid #cbdade;border-radius:9px;width:100%}.field textarea{min-height:85px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:12px;padding:6px 8px}.overlay{position:fixed;inset:0;background:#102b3f99;display:none;place-items:center;padding:15px;z-index:10}.overlay.open{display:grid}.modal{width:min(550px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:22px}.notice{padding:13px;background:#e8f6f3;border-radius:12px;margin-bottom:14px}.navmobile{display:none}.role{border-left:4px solid #19867c}.ai{background:#123749;color:white}.ai .muted{color:#b9d2d7}@media(max-width:760px){.layout{display:block}aside{display:none}main{padding:15px 12px 85px}.grid,.three,.quadrants{grid-template-columns:1fr}.week{grid-template-columns:repeat(7,125px)}h1{font-size:25px}.navmobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d9e4e8;padding:7px;justify-content:space-around;z-index:5}.navmobile button{font-size:11px;border:0;padding:7px 3px}} .preview-banner{position:sticky;top:0;z-index:20;background:#7a4d00;color:#fff;font-size:13px;line-height:1.35;padding:7px 12px;text-align:center}.preview-banner strong{letter-spacing:.5px}</style></head><body><div class="preview-banner" role="status"><strong>PREVIEW MODE</strong> · Demonstration data only · Changes stay in this browser and do not sync between devices</div><div class="layout"><aside><h2>Competen <span style="color:#8de4d0">LifeOS</span></h2><p style="padding:0 10px;color:#9dbcc5;font-size:12px">PERSONAL CHIEF OF STAFF · V1.1</p><nav id="nav"></nav><p style="padding:20px 10px;color:#a6c3cb;font-size:12px">🔒 Role-scoped commitments<br><br>Local prototype · no external AI or integrations</p></aside><main><header><div><div class="eyebrow">A LIFE LED BY WHAT MATTERS</div><h1 id="heading"></h1><div class="muted" id="desc"></div></div><button class="primary" onclick="capture()">＋ Capture</button></header><div id="content"></div></main></div><div id="mobile" class="navmobile"></div><div id="overlay" class="overlay" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div><script>
const pages={calendar:['▦ Calendar','Weekly commitments, with important time protected'],today:['☀ Today','Execute what matters'],capture:['＋ Capture','Capture, clarify and classify'],commitments:['✓ Commitments','One unified commitment engine'],worlds:['◈ My Worlds','Roles, goals and boundaries'],plan:['▤ Weekly Plan','Roles before tasks; Big Rocks before pebbles'],quadrants:['▦ Four Quadrants','Importance before urgency'],review:['↻ Weekly Review','Reflect and improve'],ai:['✦ Chief of Staff','Recommendations requiring your approval']};
const roles=[['hospital','Hospital leadership','Hospital','Patient safety and nursing development'],['business','Competen founder','Competen Holdings','Prove Scholar before scaling'],['study','Learner','Education','Professional development'],['board','School board member','School board','Responsible financial oversight'],['church','Church member','Church','Service and community'],['family','Family member','Family','Presence and connection'],['finance','Financial steward','Personal','Household resilience'],['friends','Friend and relative','Personal','Maintain relationships']];
const d=(n=0)=>{let a=new Date();a.setHours(12,0,0,0);a.setDate(a.getDate()+n);return a.toISOString().slice(0,10)},fmt=x=>x?new Date(x+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'Unscheduled',id=()=>Math.random().toString(36).slice(2),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),r=x=>roles.find(a=>a[0]===x)||roles[0],q=x=>x.important?(x.urgent?'q1':'q2'):(x.urgent?'q3':'q4');
const initial=()=>({page:'calendar',offset:0,reflection:'',intent:'Lead with patient safety, meaningful relationships and strategic work.',items:[['PICU safety round','hospital',1,1,0,'08:30',0,1],['Nursing one-on-one','hospital',1,0,1,'10:00',1,1],['Review Scholar pilot metrics','business',1,0,2,'14:00',1,1],['Complete course reading','study',1,0,3,'19:00',1,1],['School board finance pack','board',1,1,1,'16:00',0,0],['Prepare church roster','church',1,0,4,'17:00',0,0],['Family dinner, phones away','family',1,0,0,'19:30',1,1],['Review household budget','finance',1,0,5,'09:00',1,0],['Call aunt','friends',1,0,6,'17:00',0,0],['Respond to optional messages','hospital',0,1,0,'',0,0],['Read optional newsletters','business',0,0,0,'',0,0]].map(a=>({id:id(),title:a[0],role:a[1],important:!!a[2],urgent:!!a[3],date:d(a[4]),time:a[5],protected:!!a[6],rock:!!a[7],status:a[5]?'planned':'inbox',delegate:'',minutes:45}))});
let s;try{s=JSON.parse(localStorage.getItem('lifeos11'))||initial()}catch{s=initial()}const save=()=>localStorage.setItem('lifeos11',JSON.stringify(s)),live=()=>s.items.filter(x=>x.status!=='done'),start=()=>{let x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7+7*s.offset);return x},days=()=>Array.from({length:7},(_,i)=>{let x=start();x.setDate(x.getDate()+i);return x.toISOString().slice(0,10)}),week=x=>days().includes(x.date);
function go(p){s.page=p;save();render();scrollTo(0,0)}function render(){document.getElementById('heading').textContent=pages[s.page][0];document.getElementById('desc').textContent=pages[s.page][1];document.getElementById('nav').innerHTML=Object.keys(pages).map(k=>`<button class="${k===s.page?'active':''}" onclick="go('${k}')">${pages[k][0]}</button>`).join('');document.getElementById('mobile').innerHTML=['calendar','today','capture','commitments','plan'].map(k=>`<button onclick="go('${k}')">${pages[k][0]}</button>`).join('');document.getElementById('content').innerHTML=views[s.page]()}
function task(x){return `<div class="task"><div class="row"><strong>${safe(x.title)}</strong><span class="tag ${q(x)}">${q(x).toUpperCase()}</span></div><div class="muted">${safe(r(x.role)[1])} · ${fmt(x.date)} ${safe(x.time)} ${x.rock?'· ◆ Big Rock':''} ${x.protected?'· 🔒 Protected Q2':''} ${x.delegate?'· ↗ '+safe(x.delegate):''}</div><div class="actions"><button onclick="done('${x.id}')">${x.status==='done'?'↶ Reopen':'✓ Complete'}</button><button onclick="edit('${x.id}')">✎ Edit / schedule</button><button onclick="delegate('${x.id}')">↗ Delegate</button><button onclick="rock('${x.id}')">${x.rock?'◆ Unmark rock':'◇ Big Rock'}</button></div></div>`}
const views={
calendar:()=>`<div class="three"><div class="card"><div class="muted">Week commitments</div><div class="stat">${s.items.filter(week).length}</div></div><div class="card"><div class="muted">Protected Q2</div><div class="stat">${live().filter(x=>week(x)&&x.protected).length}</div></div><div class="card"><div class="muted">Big Rocks completed</div><div class="stat">${s.items.filter(x=>week(x)&&x.rock&&x.status==='done').length}/${s.items.filter(x=>week(x)&&x.rock).length}</div></div></div><div class="card"><div class="row"><h2>Weekly calendar</h2><div class="actions"><button onclick="s.offset--;save();render()">‹</button><button onclick="s.offset=0;save();render()">This week</button><button onclick="s.offset++;save();render()">›</button></div></div><div class="week">${days().map(date=>`<div class="day"><strong>${fmt(date)}</strong>${s.items.filter(x=>x.date===date&&x.status!=='inbox').sort((a,b)=>a.time.localeCompare(b.time)).map(x=>`<button class="event ${x.protected?'protected':''}" onclick="edit('${x.id}')">${safe(x.time)} ${safe(x.title)} ${x.rock?'◆':''}</button>`).join('')}<button onclick="capture('${date}')">＋</button></div>`).join('')}</div><p class="muted">Gold indicates protected Q2 time. Tap an event to edit. Scroll horizontally on mobile.</p></div><div class="grid"><div class="card"><h2>Needs clarification</h2>${s.items.filter(x=>x.status==='inbox').map(task).join('')||'Inbox clear'}</div><div class="card ai"><h2>✦ Chief of Staff</h2><p class="muted">Check your priorities, protect Q2, and consider intelligent replanning.</p><button onclick="go('ai')">Review recommendations</button></div></div>`,
today:()=>`<div class="grid"><div class="card"><h2>Today's commitments</h2>${s.items.filter(x=>x.date===d()&&x.status!=='inbox').sort((a,b)=>a.time.localeCompare(b.time)).map(task).join('')||'A clear day.'}<button class="primary" onclick="capture('${d()}')">＋ Add today</button></div><div><div class="card"><h2>Today's Big Rocks</h2>${s.items.filter(x=>x.date===d()&&x.rock).map(x=>`<p>◆ ${safe(x.title)}</p>`).join('')||'Select a Big Rock.'}</div><div class="card ai"><h2>Unexpected interruption?</h2><p class="muted">Propose a move without silently overwriting your plan.</p><button onclick="replan()">Simulate replan</button></div></div></div>`,
capture:()=>`<div class="grid"><div class="card"><h2>Quick Capture</h2>${form()}</div><div class="card"><h2>Inbox</h2>${s.items.filter(x=>x.status==='inbox').map(task).join('')||'All captured items clarified.'}<div class="notice">Capture is not automatically a commitment to do something today.</div></div></div>`,
commitments:()=>`<div class="card"><h2>Unified Commitment Engine</h2><p class="muted">Delegation retains ownership and follow-through.</p>${['inbox','planned','delegated','done'].map(st=>`<h3>${{inbox:'Needs clarification',planned:'Scheduled',delegated:'Waiting on others',done:'Completed'}[st]} (${s.items.filter(x=>x.status===st).length})</h3>${s.items.filter(x=>x.status===st).map(task).join('')||'<p class="muted">None</p>'}`).join('')}</div>`,
worlds:()=>`<div class="notice">🔒 Every commitment belongs to one role/world. Real integrations must enforce scoped permissions and avoid leaking confidential details across organisations.</div><div class="grid">${roles.map(a=>`<div class="card role"><h2>${a[1]}</h2><p class="muted">${a[2]} · ${a[3]}</p><strong>${live().filter(x=>x.role===a[0]).length} open commitments</strong>${live().filter(x=>x.role===a[0]).slice(0,3).map(x=>`<p>• ${safe(x.title)}</p>`).join('')}</div>`).join('')}</div>`,
plan:()=>`<div class="card"><div class="eyebrow">Habit 2 → Habit 3</div><h2>Begin with the end in mind. Put first things first.</h2><div class="field"><label>Weekly intention</label><textarea oninput="s.intent=this.value;save()">${safe(s.intent)}</textarea></div><div class="row"><span>${fmt(days()[0])} – ${fmt(days()[6])}</span><div><button onclick="s.offset--;save();render()">‹</button><button onclick="s.offset++;save();render()">›</button></div></div></div><div class="grid"><div class="card"><h2>1 · Review your roles</h2>${roles.map(a=>`<div class="task"><strong>${a[1]}</strong><p class="muted">${a[3]}</p><button onclick="capture('${days()[0]}','${a[0]}')">＋ Add weekly outcome</button></div>`).join('')}</div><div><div class="card"><h2>2 · Select Big Rocks</h2>${s.items.filter(x=>week(x)&&x.rock).map(task).join('')||'No Big Rocks yet.'}</div><div class="card"><h2>3 · Protect Quadrant 2</h2>${s.items.filter(x=>week(x)&&x.protected).map(x=>`<p>🔒 ${safe(x.title)}</p>`).join('')||'No protected blocks.'}<button onclick="capture('${days()[2]}')">＋ Add Q2 commitment</button></div><div class="card"><h2>4 · Schedule your week</h2><button class="primary" onclick="go('calendar')">Open calendar</button></div></div></div>`,
quadrants:()=>`<div class="notice">Importance and urgency are independent decisions. Quadrants are calculated, not assigned arbitrarily.</div><div class="quadrants">${[['q1','Urgent + important','Act on genuine deadlines'],['q2','Important + not urgent','Invest in prevention, preparation and relationships'],['q3','Urgent + not important','Question, decline or delegate'],['q4','Neither urgent nor important','Reduce or choose intentionally']].map(a=>`<div class="quad ${a[0]}"><h2>${a[0].toUpperCase()} · ${a[1]}</h2><p class="muted">${a[2]}</p>${live().filter(x=>q(x)===a[0]).map(task).join('')||'No commitments'}</div>`).join('')}</div>`,
review:()=>`<div class="grid"><div class="card"><h2>Weekly outcomes</h2><div class="three"><div><div class="stat">${s.items.filter(x=>week(x)&&x.status==='done').length}</div><div class="muted">Completed</div></div><div><div class="stat">${s.items.filter(x=>week(x)&&x.rock&&x.status==='done').length}</div><div class="muted">Big Rocks achieved</div></div><div><div class="stat">${s.items.filter(x=>week(x)&&x.protected).length}</div><div class="muted">Q2 blocks</div></div></div><h3>Accomplishments</h3>${s.items.filter(x=>week(x)&&x.status==='done').map(x=>`<p>✓ ${safe(x.title)}</p>`).join('')||'Nothing completed yet.'}<h3>Follow-through</h3>${s.items.filter(x=>week(x)&&x.status!=='done').map(x=>`<p>○ ${safe(x.title)}</p>`).join('')||'All clear.'}</div><div class="card"><h2>Reflect and improve</h2><p class="muted">What worked? Which roles need attention? What should be protected next week?</p><div class="field"><textarea id="reflection">${safe(s.reflection)}</textarea></div><button class="primary" onclick="s.reflection=document.getElementById('reflection').value;save();alert('Reflection saved in this browser')">Save reflection</button><p><button onclick="go('plan')">Plan next week →</button></p></div></div>`,
ai:()=>`<div class="grid"><div class="card ai"><h2>✦ Personal Chief of Staff</h2><p class="muted">This prototype uses deterministic rules based on local sample commitments. It does not call an AI model or external service.</p><h3>Simulate urgent hospital interruption</h3><button onclick="replan()">Generate proposed replan</button></div><div class="card"><h2>Priority observations</h2><p>${live().filter(x=>q(x)==='q2'&&!x.protected).length} important, nonurgent commitments have no protected designation.</p><p>${s.items.filter(x=>x.status==='inbox').length} items await clarification.</p><p>${s.items.filter(x=>x.status==='delegated').length} delegated items need follow-through.</p><button onclick="go('plan')">Review weekly priorities</button></div></div>`
};
function form(date='',role='hospital'){return `<form onsubmit="submitCapture(event)"><div class="field"><label>Commitment</label><input name="title" required placeholder="What needs attention?"></div><div class="field"><label>Role / world</label><select name="role">${roles.map(a=>`<option value="${a[0]}" ${role===a[0]?'selected':''}>${a[1]} · ${a[2]}</option>`).join('')}</select></div><div class="grid"><div class="field"><label>Importance</label><select name="important"><option value="1">Important</option><option value="0">Not important</option></select></div><div class="field"><label>Urgency</label><select name="urgent"><option value="0">Not urgent</option><option value="1">Urgent</option></select></div></div><div class="grid"><div class="field"><label>Date (optional)</label><input type="date" name="date" value="${date}"></div><div class="field"><label>Time</label><input type="time" name="time"></div></div><div class="field"><label>Estimated minutes</label><input type="number" name="minutes" value="30" min="5"></div><button class="primary">Save commitment</button></form>`}
function submitCapture(e){e.preventDefault();let f=new FormData(e.target),date=f.get('date');s.items.unshift({id:id(),title:f.get('title'),role:f.get('role'),important:f.get('important')==='1',urgent:f.get('urgent')==='1',date,time:f.get('time'),minutes:+f.get('minutes'),protected:false,rock:false,status:date?'planned':'inbox',delegate:''});save();closeModal();render()}
function openModal(h){document.getElementById('modal').innerHTML=h;document.getElementById('overlay').classList.add('open')}function closeModal(){document.getElementById('overlay').classList.remove('open')}function capture(date='',role='hospital'){openModal(`<h2>Quick Capture</h2>${form(date,role)}<button onclick="closeModal()">Cancel</button>`)}
function done(key){let x=s.items.find(a=>a.id===key);x.status=x.status==='done'?(x.delegate?'delegated':x.date?'planned':'inbox'):'done';save();render()}function rock(key){let x=s.items.find(a=>a.id===key);x.rock=!x.rock;save();render()}
function edit(key){let x=s.items.find(a=>a.id===key);openModal(`<h2>Edit commitment</h2><form onsubmit="saveEdit(event,'${key}')"><div class="field"><label>Title</label><input name="title" value="${safe(x.title)}" required></div><div class="field"><label>Role</label><select name="role">${roles.map(a=>`<option value="${a[0]}" ${x.role===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div><div class="grid"><div class="field"><label>Importance</label><select name="important"><option value="1" ${x.important?'selected':''}>Important</option><option value="0" ${!x.important?'selected':''}>Not important</option></select></div><div class="field"><label>Urgency</label><select name="urgent"><option value="0" ${!x.urgent?'selected':''}>Not urgent</option><option value="1" ${x.urgent?'selected':''}>Urgent</option></select></div></div><div class="grid"><div class="field"><label>Date</label><input type="date" name="date" value="${safe(x.date)}"></div><div class="field"><label>Time</label><input type="time" name="time" value="${safe(x.time)}"></div></div><div class="field"><label>Minutes</label><input type="number" name="minutes" min="5" value="${x.minutes}"></div><p><label><input type="checkbox" name="rock" ${x.rock?'checked':''}> Weekly Big Rock</label></p><p><label><input type="checkbox" name="protected" ${x.protected?'checked':''}> Protect as Q2 time</label></p><button class="primary">Save changes</button> <button type="button" onclick="closeModal()">Cancel</button></form>`)}
function saveEdit(e,key){e.preventDefault();let x=s.items.find(a=>a.id===key),f=new FormData(e.target);Object.assign(x,{title:f.get('title'),role:f.get('role'),important:f.get('important')==='1',urgent:f.get('urgent')==='1',date:f.get('date'),time:f.get('time'),minutes:+f.get('minutes'),rock:f.has('rock'),protected:f.has('protected')});if(x.status==='inbox'&&x.date)x.status='planned';save();closeModal();render()}
function delegate(key){let x=s.items.find(a=>a.id===key);openModal(`<h2>Delegate with accountability</h2><p>${safe(x.title)}</p><form onsubmit="saveDelegate(event,'${key}')"><div class="field"><label>Responsible person / team</label><input name="person" required value="${safe(x.delegate)}"></div><div class="field"><label>Follow-up date</label><input type="date" name="date" value="${x.date||d(2)}"></div><button class="primary">Delegate and track</button></form>`)}
function saveDelegate(e,key){e.preventDefault();let x=s.items.find(a=>a.id===key),f=new FormData(e.target);x.delegate=f.get('person');x.date=f.get('date');x.status='delegated';save();closeModal();render()}
function replan(){let x=s.items.find(a=>a.date===d()&&a.status==='planned'&&!a.protected&&!a.urgent)||s.items.find(a=>a.date===d()&&a.status==='planned'&&!a.protected);if(!x)return openModal('<h2>No flexible slot found</h2><p>Preserve protected blocks and review the schedule manually.</p><button onclick="closeModal()">Close</button>');openModal(`<div class="eyebrow">Proposal · not yet applied</div><h2>Urgent hospital interruption</h2><p>Simulation: a new urgent incident requires attention today.</p><p>Move <strong>${safe(x.title)}</strong> to <strong>${fmt(d(1))}</strong>, retaining its role and priority?</p><p class="muted">Check external calendar conflicts manually. No protected Q2 block was selected for movement.</p><button class="primary" onclick="approve('${x.id}')">Approve move</button> <button onclick="closeModal()">Keep original plan</button>`)}
function approve(key){s.items.find(a=>a.id===key).date=d(1);save();closeModal();render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
