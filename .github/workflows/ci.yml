# CI (COMP-SEC-001 "Developer Security Standards" -- the smallest real increment, per the
# conformance map). Six jobs, each a distinct red light.
#
# ⚠ NO SECRETS, BY DESIGN. The database harnesses authenticate with the service-role key, and that
# key does not belong in GitHub. They run locally against the live database, as they always have;
# this pipeline runs everything that needs none of that. Handing CI a staging project + secrets is
# a deliberate later step, not a default.
#
# ⚠ THE DEPENDENCY GATE IS OURS (scripts/audit-gate.ts + security/audit-allowlist.json), not a
# third-party parser -- the first candidate crashed against npm's report shape, and a gate that can
# crash can be green by accident. Every tolerated advisory prints on every run.
#
# ⚠ THE `test` JOB (COMP-ENG-001 s6/s9) IS DELIBERATELY NARROW. It runs the 10 files under
# src/**/*.test.ts (vitest.config.ts's own include pattern) -- confirmed locally, twice, to pass
# deterministically with zero Supabase/service-role dependency before this job existed. It does NOT
# run any of the 180 DATABASE-DEPENDENT scripts/*-harness.ts acceptance scripts: those authenticate
# against the PRODUCTION Supabase project (see docs/HARNESS-INVENTORY.md), and handing that key to
# GitHub is out of scope.
#
# ⚠ THIS SAID "no staging project exists yet" UNTIL 2026-08-22, AND IT WAS WRONG BY THEN. A staging
# project does exist -- it is the one smoke-authenticated below already names through STAGING_*, and
# the reason that job could be written at all. The stale clause was read as a statement of fact
# about the estate during CPR-BOOK-E2E-001 and produced an acceptance report claiming there was
# nowhere to run the acceptance journey. Corrected rather than deleted, because the next reader of
# this block deserves to know it was once wrong: a comment is evidence of what somebody believed
# when they wrote it, and an absence nobody re-reads becomes a lie by attrition.
#
# What remains true is the narrower claim: the DB-dependent harnesses are pointed at production and
# are not run here. Moving them to staging is still open work (COMP-ENG-001 s7, s9 step 8).
#
# ⚠ THE `harnesses` JOB RUNS 22 OF THE 32 CREDENTIAL-FREE ONES, NOT ALL 32. Each of the 32 was run
# twice with a scrubbed environment on 2026-08-18: six are RED on real pre-existing defects and four
# would have reported green in CI for a reason unrelated to what they check (no build, no dev server,
# no working-tree diff, or a live network call). scripts/ci-harnesses.ts names all ten and the reason
# each is out, and fails if a newly added pure/local harness is in neither list.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: nothing here builds or runs the app, so native postinstalls (sharp) are
      # pure attack surface with no benefit in this job.
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npx tsc --noEmit
      # eslint's default exit is non-zero on ERRORS only -- warnings inform, errors gate. The ten
      # pre-existing errors were fixed the day this pipeline landed so it was not born red.
      - name: Lint
        run: npx eslint src

  security:
    name: Dependency + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ⚠ THE SECRET SCAN RUNS BEFORE npm ci, ON PURPOSE. After install the tree holds node_modules,
      # which is thousands of files that are not ours and an hour of scanning for nothing -- the
      # local dry run proved it. A clean checkout IS the set of files a leaked secret could ship in.
      # Known fixture values carry inline `gitleaks:allow` annotations at their own lines.
      - name: Secret scan (gitleaks, clean checkout)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency gate (high/critical, allowlist with reasons)
        run: npx tsx scripts/audit-gate.ts

  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Vitest
        run: npm run test

  harnesses:
    name: Acceptance harnesses (no-credential subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # scripts/ci-harnesses.ts holds the list AND the reason each excluded harness is out, printing
      # every exclusion on each run. It also fails if a newly added pure/local harness appears in
      # neither list -- otherwise a harness written later is silently absent from CI forever.
      - name: Credential-free acceptance harnesses
        run: npx tsx scripts/ci-harnesses.ts

  smoke:
    name: Playwright smoke (credential-free journeys)
    runs-on: ubuntu-latest
    # ⚠ THESE ARE DELIBERATELY NON-FUNCTIONAL PLACEHOLDERS, NOT SECRETS AND NOT A STAGING DATABASE.
    # The app reads them at boot; pointing them at a closed port means every data read fails closed,
    # which is exactly what this job is proving survives. Verified locally 2026-08-18 with these same
    # values: the three journeys pass and the app logs "could not read launch flag -- treating it as
    # OFF" instead of throwing. What this job proves is that the app BOOTS, SERVES its public routes
    # and DENIES a protected one -- not that any data renders. Data-dependent journeys are the four
    # credential-gated ones, which skip here by design (see e2e/README.md).
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-no-database-reachable-in-ci
      # ⚠ NO SUPABASE_SERVICE_ROLE_KEY HERE, DELIBERATELY, AND ITS ABSENCE IS NOW PART OF THE TEST.
      # A placeholder was added here when this job first went red, then REMOVED after COMP-ENG-002 §6/§7
      # asked the right question: "a privileged Supabase key must not be added merely because a route
      # currently throws without it." The audit (docs/COMP-ENG-002-admin-client-audit.md) found the throw
      # was a real defect, not a missing config -- five PUBLIC pages constructed a privileged client just
      # to read one launch-flag boolean, and did it eagerly enough to crash before the fail-safe that was
      # already written for exactly this case could run. They now use createAdminClientOrNull().
      # Keeping the variable unset means this job proves that fix stays fixed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ⚠ FULL `npm ci` HERE, UNLIKE EVERY OTHER JOB. The others skip postinstalls because they never
      # run the app; this one starts a real Next dev server, which wants sharp built.
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # ⚠ DIAGNOSTIC, NOT CEREMONY. Job logs are not readable without repo-admin rights, so when this job
      # goes red the status alone says nothing. Printing the HTTP STATUS of each smoke route separates
      # the classes that actually occur: 200 means the route serves and any failure is an assertion; 500
      # means the app crashed serving it (the missing-env class above); a connection refusal means the
      # server never came up at all. Remove once this job has been green for a while.
      - name: Route status before the suite
        run: |
          npm run dev &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:3000; then echo "server up after ${i}s"; break; fi
            sleep 1
          done
          for p in / /practice /practice/home; do
            echo "$p -> HTTP $(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$p")"
          done
          pkill -f "next dev" || true
      - name: Smoke suite
        run: npx playwright test
      # The report is the diagnosis when a smoke journey fails; a failed run with no artifact means
      # re-running locally and hoping it reproduces.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  smoke-authenticated:
    name: Playwright smoke (authenticated journeys, staging)
    runs-on: ubuntu-latest
    # ⚠ STAGING ONLY, AND THE SUITE ITSELF ENFORCES IT. e2e/helpers/synthetic-practitioner.ts refuses to
    # run when the app resolves to the production project ref, and additionally BLOCKS any request to it
    # at the network layer before dispatch. Configuring this job with production values does not produce
    # a wrong result, it produces a refusal.
    #
    # ⚠ MISSING CREDENTIALS FAIL THIS JOB, THEY DO NOT SKIP IT (§6). The same helper throws when CI is
    # set and the smoke variables are absent. A required check that goes green by running nothing would
    # stay green through a rotated secret or a renamed variable -- the exact regressions it exists for.
    #
    # ⚠ IT BUILDS AND RUNS THE REAL SERVER RATHER THAN next dev. Under next dev a Next runtime chunk is
    # refused to the browser (403 to the browser, 200 to curl) and React never hydrates, so the sign-in
    # form is inert markup and no authentication ever happens. Measured 2026-08-19, on two ports and on
    # both production- and staging-pointed dev servers. A built server has neither problem.
    env:
      # The staging environment contract (§4). NEXT_PUBLIC_* are inlined into the client bundle at BUILD
      # time, so they must be present for the build step, not only at run time.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      SMOKE_PRACTITIONER_EMAIL: ${{ secrets.SMOKE_PRACTITIONER_EMAIL }}
      SMOKE_PRACTITIONER_PASSWORD: ${{ secrets.SMOKE_PRACTITIONER_PASSWORD }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      PLAYWRIGHT_WEB_SERVER_CMD: npm run start -- -p 3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Full install, not --ignore-scripts: this job builds and runs the app, which wants sharp built.
      - run: npm ci
      - name: Refuse to run without the staging environment
        # A build with an empty NEXT_PUBLIC_SUPABASE_URL bakes an unusable client into the bundle and
        # then fails much later, in the browser, as a confusing sign-in error. Checking here names the
        # cause. The values themselves are never echoed.
        run: |
          missing=""
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && missing="$missing STAGING_SUPABASE_URL"
          [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && missing="$missing STAGING_ANON_KEY"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing STAGING_SERVICE_ROLE_KEY"
          [ -z "$SMOKE_PRACTITIONER_EMAIL" ] && missing="$missing SMOKE_PRACTITIONER_EMAIL"
          [ -z "$SMOKE_PRACTITIONER_PASSWORD" ] && missing="$missing SMOKE_PRACTITIONER_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing required repository secrets:$missing"
            echo "This gate fails closed -- it does not skip. Set them for the STAGING project only."
            exit 1
          fi
          echo "All five staging secrets are present."
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build (staging environment is inlined here)
        run: npm run build
      - name: Authenticated journeys
        # Only the credential-gated journeys. The credential-free ones keep their own job against a
        # deliberately unreachable database, which proves the app fails closed -- a different property,
        # and §6 requires both to be retained.
        run: npx playwright test e2e/smoke/04-practitioner-sign-in.spec.ts e2e/smoke/05-post-login-routing.spec.ts e2e/smoke/06-command-centre.spec.ts e2e/smoke/07-practice-planner.spec.ts
      # ⚠ NO TRACE ARTIFACT FROM THIS JOB. playwright.config.ts sets trace: "off" under CI because a
      # trace records fill() arguments, which would put the practitioner password into a downloadable
      # artifact. The HTML report keeps screenshots, where a password input renders as dots.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-authenticated
          path: playwright-report/
          retention-days: 7

  migrations:
    name: Migration house rules (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Only migrations CHANGED in this push/PR -- history is already applied by hand and re-linting
      # it is noise. A first push or force-push (zero SHA) skips with a note rather than guessing.
      - name: House rules on changed migrations
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base commit for a diff -- skipping (first push or force-push)"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" -- 'supabase/migrations/*.sql' || true)
          if [ -z "$CHANGED" ]; then
            echo "no migrations changed"
            exit 0
          fi
          for f in $CHANGED; do
            echo "── $f"
            npx tsx scripts/migration-house-rules.ts "$f"
          done
